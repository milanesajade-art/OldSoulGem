<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183f34">
  <title>Checkout received | Old Soul Gem</title>
  <meta name="description" content="Your Old Soul Gem checkout request was received.">
  <style>
    :root{--cream:#f6f0e5;--paper:#fffaf1;--forest:#183f34;--gold:#b8873d;--ink:#24332c;--muted:#706a61}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--cream),#ded8c5);color:var(--ink);font-family:Montserrat,Arial,sans-serif}.card{width:min(100%,680px);padding:clamp(34px,7vw,70px);background:var(--paper);border:1px solid rgba(184,135,61,.3);box-shadow:0 30px 90px rgba(23,38,31,.18);text-align:center}.mark{color:var(--gold);font-size:28px}.kicker{margin:12px 0;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{margin:0 0 18px;color:var(--forest);font:600 clamp(48px,8vw,76px)/.92 Georgia,serif}p{max-width:520px;margin:0 auto 18px;color:var(--muted);line-height:1.65}.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:10px;padding:0 24px;background:var(--forest);color:#fff;text-decoration:none;text-transform:uppercase;font-size:11px;letter-spacing:.1em;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">✦</div>
    <p class="kicker">Old Soul Gem direct checkout</p>
    <h1>Thank you.</h1>
    <p>Your request was received. Old Soul Gem will confirm availability and send the secure payment details or order update to the email you provided.</p>
    <a class="button" href="index.html#shop">Return to the collection</a>
  </main>
</body>
</html>
