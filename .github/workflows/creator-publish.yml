name: Publish Vida Creator Changes

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: vida-creator-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.user.login == 'milanesajade-art' && contains(github.event.issue.body, '<!-- VIDA_CREATOR_PUBLISH_V4 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate and build production data
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, time

          marker = '<!-- VIDA_CREATOR_PUBLISH_V4 -->'
          event = json.load(open(os.environ['EVENT_PATH'], encoding='utf-8'))
          issue = event.get('issue') or {}
          actor = (issue.get('user') or {}).get('login')
          if actor != 'milanesajade-art':
              raise SystemExit('Only the repository owner can publish Creator changes.')

          body = issue.get('body') or ''
          if marker not in body:
              raise SystemExit('Missing Vida Creator publish marker.')

          data = json.loads(body.split(marker, 1)[1].strip())
          pieces = data.get('pieces')
          site = data.get('site')
          baseline_fingerprint = str(data.get('baselineFingerprint') or '')
          if not isinstance(pieces, list) or not pieces:
              raise SystemExit('Publish package must contain collection pieces.')
          if not isinstance(site, dict):
              raise SystemExit('Publish package must contain site content.')

          def read_js_assignment(filename):
              text = pathlib.Path(filename).read_text(encoding='utf-8')
              raw = text.split('=', 1)[1].strip()
              if raw.endswith(';'):
                  raw = raw[:-1]
              return json.loads(raw)

          def fingerprint(value):
              canonical = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              h = 2166136261
              for byte in canonical:
                  h ^= byte
                  h = (h * 16777619) & 0xffffffff
              return f'{h:08x}'

          current_pieces = read_js_assignment('collection-data.js')
          current_site = read_js_assignment('site-data.js')
          current_fingerprint = fingerprint({'pieces': current_pieces, 'site': current_site})
          if baseline_fingerprint != current_fingerprint:
              raise SystemExit('Creator workspace is stale. Reload the current production baseline before publishing.')

          allowed_piece = {'id','name','status','visibility','price','materials','story','image'}
          clean_pieces, seen = [], set()
          for p in pieces:
              if not isinstance(p, dict):
                  raise SystemExit('Invalid piece record.')
              q = {k: str(p.get(k, '')) for k in allowed_piece}
              q['visibility'] = 'hidden' if q['visibility'] == 'hidden' else 'public'
              if not q['id'].startswith('VIDA ') or q['id'] in seen:
                  raise SystemExit('Invalid or duplicate VIDA ID.')
              if not q['name'].strip():
                  raise SystemExit(f"{q['id']} is missing a name.")
              if q['visibility'] == 'public':
                  for field in ('materials', 'story', 'price'):
                      if not q[field].strip():
                          raise SystemExit(f"{q['id']} is missing required public field: {field}.")
                  if not q['image'].strip() and q['id'] != 'VIDA 002':
                      raise SystemExit(f"{q['id']} needs a production image before publishing publicly.")
              seen.add(q['id'])
              clean_pieces.append(q)

          allowed_site = {'eyebrow','heroTitle','heroLede','primaryCta','secondaryCta','atelierTitle','atelierBody','collectionTitle','collectionBody','storyTitle','storyLead','storyBody','inquiryTitle','inquiryBody','availability'}
          clean_site = {k: str(site.get(k, '')) for k in allowed_site}
          for field in ('heroTitle','heroLede','collectionTitle','inquiryTitle','inquiryBody','availability'):
              if not clean_site[field].strip():
                  raise SystemExit(f'Missing required site field: {field}.')

          pathlib.Path('collection-data.js').write_text('window.VIDA_COLLECTION_DEFAULTS = ' + json.dumps(clean_pieces, ensure_ascii=False, indent=2) + ';\n', encoding='utf-8')
          pathlib.Path('site-data.js').write_text('window.VIDA_SITE_DEFAULTS = ' + json.dumps(clean_site, ensure_ascii=False, indent=2) + ';\n', encoding='utf-8')

          stamp = str(int(time.time()))
          for filename in ('index.html','product.html','creator.html'):
              path = pathlib.Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\?v=\d+', '?v=' + stamp, text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit production data
        run: |
          git config user.name "Vida Creator Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add collection-data.js site-data.js index.html product.html creator.html
          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "Publish Creator changes from GitHub-authenticated request"
            git push origin HEAD:main
          fi

      - name: Confirm and close publish request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Vida Creator changes were validated against the current production baseline and published to main. GitHub Pages deployment has been triggered."
          gh issue close "$ISSUE_NUMBER"
